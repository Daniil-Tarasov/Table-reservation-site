{% extends 'restaurant/base.html' %}

{% block title %}
Смена пароля
{% endblock %}

{% block content %}
<main class="default-background">
    <div class="text-center p-5 mt-5 text-white">
        <h1>
            Смена пароля
        </h1>
    </div>
    <form method="post" action="" class="form-floating">
        <div class="d-flex justify-content-center py-3">
            <div class="col-6 text-white">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success">Задать новый пароль</button>
            </div>
        </div>
    </form>
</main>
{% endblock %}
